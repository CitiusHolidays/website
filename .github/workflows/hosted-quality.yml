name: Hosted Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hosted-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  target-neutral:
    name: Target-neutral quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting and lint
        run: bun run lint
      - name: Enforce lint ratchet
        run: bun run lint:ratchet
      - name: Run the complete test suite
        run: bun run test
      - name: Check public assets
        run: bun run assets:check
      - name: Audit root dependencies
        run: bun audit --audit-level=high
      - name: Install Studio dependencies
        working-directory: citius-blog
        run: bun install --frozen-lockfile
      - name: Build Studio
        working-directory: citius-blog
        run: bun run build
      - name: Audit Studio dependencies
        working-directory: citius-blog
        run: bun audit --audit-level=high
      - name: Record revision-bound summary
        if: always()
        run: |
          {
            echo "## Hosted Quality"
            echo "Revision: \`${GITHUB_SHA}\`"
            echo "Scope: complete credential-free target-neutral test and quality checks"
            echo "Provider deployment and authenticated proof: not run"
          } >> "${GITHUB_STEP_SUMMARY}"
