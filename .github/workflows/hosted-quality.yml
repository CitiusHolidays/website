name: Hosted Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hosted-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  target-neutral:
    name: Required quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install Studio lint dependencies
        working-directory: citius-blog
        run: bun install --frozen-lockfile
      - name: Run the shared required quality suite
        run: bun run quality:target-neutral
      - name: Record revision-bound summary
        if: always()
        run: |
          {
            echo "## Hosted Quality"
            echo "Revision: \`${GITHUB_SHA}\`"
            echo "Scope: zero-warning lint, application and Convex typechecks, all target-neutral tests, and coverage"
            echo "Provider deployment and authenticated proof: not run"
          } >> "${GITHUB_STEP_SUMMARY}"
